# 3주차 실습 CI 파이프라인: checkout → build → test → package → artifact 저장
# (3-1: build/test, 3-2: 환경 고정, 3-3: package/artifact)
# GitHub Actions는 저장소 루트의 .github/workflows/ 아래 파일만 인식한다.
name: week3-ci

on:
  push:
    branches: [main]
    # 3주차 실습과 관계없는 파일만 바뀌었을 때는 파이프라인을 돌리지 않는다
    paths:
      - "practice/week3/**"
      - ".github/workflows/week3-ci.yml"
  pull_request:
    paths:
      - "practice/week3/**"
      - ".github/workflows/week3-ci.yml"
  # Actions 탭에서 수동 실행 버튼을 쓸 수 있게 한다
  workflow_dispatch:

jobs:
  build-and-test:
    # 러너(빌드 에이전트): GitHub가 매 실행마다 새로 띄워주는 깨끗한 VM
    # 3-2: ubuntu-latest는 GitHub가 가리키는 대상을 바꿀 수 있는 "움직이는 태그"라서
    #      OS 버전을 명시적으로 고정한다 (로컬 WSL도 Ubuntu 24.04)
    runs-on: ubuntu-24.04

    # 모든 run 스텝의 기본 작업 디렉터리를 Bazel 워크스페이스 루트로 지정
    defaults:
      run:
        working-directory: practice/week3

    steps:
      # 1) checkout: 러너는 빈 VM이므로 소스를 먼저 받아와야 한다
      - name: Checkout
        uses: actions/checkout@v5

      # 러너에 미리 설치된 bazel은 bazelisk이므로 .bazelversion(9.2.0)을 읽어 그 버전을 받는다
      - name: Show Bazel version
        run: bazel --version

      # 3-2: 러너의 OS와 호스트 컴파일러 정보를 남긴다 ("CI에서만 실패" 시 로컬과 비교할 근거)
      - name: Show environment
        run: |
          grep PRETTY_NAME /etc/os-release
          uname -r
          gcc --version | head -1

      # 2) build: 워크스페이스의 모든 타겟을 빌드 (.bazelrc의 ci 설정 적용)
      - name: Build
        run: bazel build --config=ci //...

      # 3-2: Bazel이 실제로 어떤 컴파일러로 빌드했는지 바이너리를 실행해 확인
      - name: Toolchain info
        run: bazel run --config=ci //:toolchain_info

      # 3) test: cc_test 타겟을 실행. 실패하면 이 스텝이 non-zero로 끝나 파이프라인이 빨간색이 된다
      #    (--test_output=errors는 .bazelrc로 옮겼다)
      - name: Test
        run: bazel test --config=ci //...

      # 3-3) test 리포트 저장: 러너 VM은 Job이 끝나면 폐기되므로 로그를 밖으로 꺼낸다.
      #      if: always() → 테스트가 실패해도 실행된다 (실패 로그가 가장 필요한 순간이므로)
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.run_number }}
          # bazel-testlogs는 심볼릭 링크지만 업로드 액션이 따라가서 실제 파일을 수집한다
          path: |
            practice/week3/bazel-testlogs/**/test.xml
            practice/week3/bazel-testlogs/**/test.log
          retention-days: 7

      # 4) package: git 정보를 새긴(stamped) 릴리스 패키지를 빌드
      #    버전 = 0.1.<CI 실행 번호> → 같은 커밋을 다시 돌려도 실행마다 고유한 번호가 붙는다
      - name: Package
        env:
          BUILD_VERSION: 0.1.${{ github.run_number }}
        run: |
          bazel build --config=ci --config=release //:app_pkg
          # 산출물 경로를 하드코딩하지 않고 Bazel에게 물어본다
          PKG=$(bazel cquery --config=ci --config=release --output=files //:app_pkg 2>/dev/null)
          mkdir -p "$RUNNER_TEMP/dist"
          cp "$PKG" "$RUNNER_TEMP/dist/app-${BUILD_VERSION}.tar.gz"
          tar -xzOf "$PKG" app/BUILD_INFO.txt
          sha256sum "$RUNNER_TEMP/dist/"*

      # 5) artifact 저장: 버전이 붙은 패키지를 GitHub에 업로드
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: app-0.1.${{ github.run_number }}-${{ github.sha }}
          path: ${{ runner.temp }}/dist/
          retention-days: 7
